<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URP Staff | Functies</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/staff.css">
</head>
<body>
<div class="staff-bg"></div>
<div id="siteHeader"></div>
<main class="staff-container">
    <div class="staff-hero">
        <h2>Staff <span>Functies</span></h2>
        <p>Rollen, permissies en Discord role-ID's</p>
    </div>
    <div id="content"><p class="staff-empty"><i class="fas fa-spinner fa-spin"></i> Laden...</p></div>
</main>
<footer class="staff-footer">© Utrecht Roleplay · Staff Portaal</footer>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
    if (!requireLogin()) throw 0;
    mountHeader('functies');
    fetch('/data/functies.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (data) { renderFuncties(data, document.getElementById('content')); })
        .catch(function () {
            document.getElementById('content').innerHTML =
                '<p class="staff-empty">Kon functies niet laden.</p>';
        });
</script>
</body>
</html>
