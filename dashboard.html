<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URP Staff | Dashboard</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/staff.css">
    <script src="/js/maintenance-check.js"></script>
</head>
<body>
<div class="staff-bg"></div>
<div id="siteHeader"></div>
<main class="staff-container">
    <div class="staff-hero">
        <h2>Staff <span>Dashboard</span></h2>
        <p>Welkom, <strong id="welcomeName"></strong></p>
    </div>
    <div class="staff-dashboard-grid">
        <a href="/regels.html" class="staff-dash-card"><i class="fas fa-gavel"></i><h3>Regels</h3><p>Staffregels</p></a>
        <a href="/functies.html" class="staff-dash-card"><i class="fas fa-layer-group"></i><h3>Staff functies</h3><p>Rollen & role-ID's</p></a>
        <a href="/team.html" class="staff-dash-card"><i class="fas fa-users"></i><h3>Staff team</h3><p>Per rank</p></a>
        <a href="/dossiers.html" id="dashDossiersCard" class="staff-dash-card" hidden><i class="fas fa-folder-open"></i><h3>Staff dossiers</h3><p>Warns & ontslagen</p></a>
        <a href="/admin/" id="dashBeheerCard" class="staff-dash-card" hidden><i class="fas fa-cog"></i><h3>Beheer</h3><p>Inhoud bewerken</p></a>
    </div>
</main>
<footer class="staff-footer">© Utrecht Roleplay · Staff Portaal</footer>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
    if (!requireLogin()) throw 0;
    mountHeader('home');
    document.getElementById('welcomeName').textContent = userName();
    if (isBeheer()) document.getElementById('dashBeheerCard').hidden = false;
    if (canViewDossiers()) document.getElementById('dashDossiersCard').hidden = false;
</script>
</body>
</html>
