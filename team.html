<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URP Staff | Team</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/staff.css">
    <script src="/js/maintenance-check.js"></script>
</head>
<body>
<div class="staff-bg"></div>
<div id="siteHeader"></div>
<main class="staff-container">
    <div class="staff-hero"><h2>Staff <span>Team</span></h2><p>Live vanuit Discord · elke rol = één rank</p></div>
    <p class="staff-live-badge" id="liveBadge" style="display:none"></p>
    <div class="staff-card">
        <div class="staff-card-title"><i class="fas fa-users"></i> Teamoverzicht</div>
        <div id="content"><p class="staff-empty"><i class="fas fa-spinner fa-spin"></i> Team laden van Discord...</p></div>
    </div>
</main>
<footer class="staff-footer">© Utrecht Roleplay · Staff Portaal</footer>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
    if (!requireLogin()) throw 0;
    mountHeader('team');

    const contentEl = document.getElementById('content');
    const badgeEl = document.getElementById('liveBadge');
    let loading = false;

    function setBadge(data) {
        if (!data || !data.updatedAt) {
            badgeEl.style.display = 'none';
            return;
        }
        const when = formatLiveTime(data.updatedAt);
        badgeEl.style.display = 'block';
        badgeEl.innerHTML =
            '<i class="fas fa-circle" style="color:#22c55e;font-size:0.5rem"></i> ' +
            'Live van Discord · bijgewerkt ' + escapeHtml(when) +
            (data.cached ? ' (cache)' : '');
    }

    async function loadTeam(silent) {
        if (loading) return;
        loading = true;
        if (!silent) {
            contentEl.innerHTML =
                '<p class="staff-empty"><i class="fas fa-spinner fa-spin"></i> Team laden van Discord...</p>';
        }
        try {
            const data = await fetchStaffTeam();
            renderTeam(data.ranks, contentEl);
            setBadge(data);
        } catch (e) {
            contentEl.innerHTML =
                '<p class="staff-empty">' + escapeHtml(e.message) + '</p>';
            badgeEl.style.display = 'none';
        } finally {
            loading = false;
        }
    }

    loadTeam(false);
    setInterval(function () { loadTeam(true); }, 90000);
</script>
</body>
</html>
