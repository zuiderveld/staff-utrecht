<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URP Staff | Team</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/staff.css">
</head>
<body>
<div class="staff-bg"></div>
<div id="siteHeader"></div>
<main class="staff-container">
    <div class="staff-hero"><h2>Staff <span>Team</span></h2><p>Leden per rank</p></div>
    <div class="staff-card">
        <div class="staff-card-title"><i class="fas fa-users"></i> Teamoverzicht</div>
        <div id="content"><p class="staff-empty"><i class="fas fa-spinner fa-spin"></i> Laden...</p></div>
    </div>
</main>
<footer class="staff-footer">© Utrecht Roleplay · Staff Portaal</footer>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
    if (!requireLogin()) throw 0;
    mountHeader('team');
    fetchSite().then(function (s) { renderTeam(s.ranks, document.getElementById('content')); });
</script>
</body>
</html>
