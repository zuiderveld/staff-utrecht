<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URP Staff Portaal</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/staff.css">
    <style>
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .login-box {
            background: rgba(24, 20, 36, 0.95); border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 28px; padding: 2.5rem; max-width: 420px; width: 100%; text-align: center;
        }
        .login-box img { width: 100px; border-radius: 16px; margin-bottom: 1rem; }
        .login-box h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
        .login-box h1 span { color: #a78bfa; }
        .login-box > p { color: #9ca3af; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .btn-discord {
            width: 100%; padding: 1rem; border: none; border-radius: 50px;
            background: #5865f2; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-discord:hover { filter: brightness(1.08); }
        .btn-discord:disabled { opacity: 0.6; cursor: wait; }
        .login-error { color: #fca5a5; font-size: 0.85rem; margin-top: 1rem; display: none; }
        .login-error.show { display: block; }
        .login-hint { font-size: 0.75rem; color: #6b7280; margin-top: 1.25rem; }
    </style>
</head>
<body>
<div class="staff-bg"></div>
<div class="login-wrap">
    <div class="login-box">
        <img src="/assets/favicon.png" alt="URP Staff">
        <h1>URP <span>Staff</span></h1>
        <p>Log in met Discord · alleen staff met de juiste serverrol</p>
        <button type="button" class="btn-discord" id="btnDiscord">
            <i class="fab fa-discord"></i> Inloggen met Discord
        </button>
        <p class="login-error" id="loginError"></p>
        <p class="login-hint">Utrecht Roleplay · Staff Portaal</p>
    </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
    (function () {
        const params = new URLSearchParams(location.search);
        if (params.get('redirect')) {
            sessionStorage.setItem('urpStaffRedirect', params.get('redirect'));
        }

        const errEl = document.getElementById('loginError');
        const btn = document.getElementById('btnDiscord');

        function showError(msg) {
            errEl.textContent = msg;
            errEl.classList.add('show');
        }

        function goAfterLogin() {
            const dest = sessionStorage.getItem('urpStaffRedirect') || '/dashboard.html';
            sessionStorage.removeItem('urpStaffRedirect');
            location.replace(dest);
        }

        async function handleCode(code) {
            btn.disabled = true;
            try {
                await discordAuthWithCode(code);
                history.replaceState(null, '', '/');
                goAfterLogin();
            } catch (e) {
                showError(e.message);
                btn.disabled = false;
            }
        }

        const code = params.get('code');
        if (code) {
            handleCode(code);
            return;
        }

        if (isLoggedIn()) {
            goAfterLogin();
            return;
        }

        btn.onclick = function () {
            window.location.href = getDiscordAuthUrl();
        };
    })();
</script>
</body>
</html>
